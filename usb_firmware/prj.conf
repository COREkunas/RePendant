# USB-update development base: BLE OP protocol + button + RGB + USB shell.
# The original independent_firmware project is deliberately unchanged.
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="OpenPendant"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_MAX_CONN=1
# Extra headroom for authenticated command parsing and native settings paths.
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
# Bounded host-side pipelining experiment; ATT/callback counts default to this.
# The independently installed radio keeps its existing three controller credits.
CONFIG_BT_BUF_ACL_TX_COUNT=6
# Fast short-clip transfers; actual connection interval remains phone-controlled.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# Legacy CDC ACM matches the nRF5340 MCUboot serial-recovery implementation
# in the pinned nRF Connect SDK 3.4.0. These are development-only USB IDs,
# not an assigned production VID/PID and not the factory pendant identity.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
# Binary backup lifecycle/pending-RX snapshots rely on this exact single-core,
# cooperative USB producer. Do not change without re-auditing the adapter.
CONFIG_USB_WORKQUEUE=y
CONFIG_USB_WORKQUEUE_PRIORITY=-1
CONFIG_SMP=n
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x0001
CONFIG_USB_DEVICE_MANUFACTURER="OpenPendant development"
CONFIG_USB_DEVICE_PRODUCT="OpenPendant USB diagnostics"
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y

# Local serial shell only. No generic hardware/debug/memory command surface.
CONFIG_SHELL=y
CONFIG_SHELL_MINIMAL=y
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=13
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_SHELL_PROMPT_UART="openpendant> "
CONFIG_SHELL_CMDS=n
CONFIG_DEVICE_SHELL=n
CONFIG_KERNEL_SHELL=n
CONFIG_DEVMEM_SHELL=n
CONFIG_GPIO_SHELL=n
CONFIG_PWM_SHELL=n
CONFIG_HWINFO_SHELL=n
CONFIG_FLASH_SHELL=n
CONFIG_BT_SHELL=n
CONFIG_SHELL_BACKEND_RTT=n

# App and MCUboot use the board's same GPREGRET1-backed boot-mode byte.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_REBOOT=y

# Native authenticated LE Secure Connections. First pairing needs a local USB
# window and its fresh passkey; each short BLE capture needs a physical tap.
# Only bond/settings metadata uses the existing reserved 32 KiB internal area.
# No audio is stored in flash. Only the fixed local NAND ID query is allowed;
# no NAND storage driver, program/erase or generic flash/SPI commands exist.
# 0.3.2 additionally reproduces factory P1.07 output-HIGH only on explicit ID
# admission. No auxiliary LOW, NAND reset, unlock or feature writes are allowed.
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_SMP_MIN_ENC_KEY_SIZE=16
CONFIG_BT_BONDABLE=y
CONFIG_BT_BONDING_REQUIRED=y
CONFIG_BT_SMP_ENFORCE_MITM=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=n
CONFIG_BT_USE_DEBUG_KEYS=n
CONFIG_BT_STORE_DEBUG_KEYS=n
CONFIG_BT_LOG_SNIFFER_INFO=n
CONFIG_BT_FIXED_PASSKEY=n
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_KEYS_OVERWRITE_OLDEST=n
CONFIG_BT_SETTINGS=y
CONFIG_BT_SETTINGS_CCC_STORE_ON_WRITE=n
CONFIG_BT_SETTINGS_CF_STORE_ON_WRITE=n
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_NVS_SECTOR_SIZE_MULT=1
CONFIG_SETTINGS_NVS_SECTOR_COUNT=8
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SETTINGS_SHELL=n
CONFIG_I2C=n
# 0.3.3 adds a dormant fixed TWIM1 WHO_AM_I query via bounded direct HAL.
# No generic I2C/sensor driver, bus scan, recovery pulses or sensor config writes.
# Keep automatic SPI/NRFX drivers disabled. nand_id.c owns only dormant SPIM4
# through fixed HAL calls around one explicit, bounded ID-only USB request.
CONFIG_SPI=n
CONFIG_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

CONFIG_ASSERT=y
# A fatal error must reboot into the default-microphone-off initialization,
# rather than halt indefinitely while a bounded capture might be active.
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=4096
# Fixed public enrollment commands include a 65-byte SEC1 key encoded as hex.
# Keep the complete longest command plus its terminator within this bound.
CONFIG_SHELL_CMD_BUFF_SIZE=384

# Dormant local synthetic-only crypto diagnostic, never a recording service.
# Dedicated 16 KiB worker and timeout queue are declared in crypto_commands.c.
# Heap is shared with other PSA users; this is capacity, not measured peak use.
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_MBEDTLS_HEAP_SIZE=4096
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
# Fixed-point Opus uses guarded variable-length stack scratch. The 64 KiB
# diagnostic worker is a measured admission floor, not a formal peak proof.
CONFIG_STACK_CANARIES_STRONG=y
