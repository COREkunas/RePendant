# Dedicated USB recovery build; no external storage is used for updates.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y
SB_CONFIG_MCUBOOT_UPDATEABLE_IMAGES=1
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# Use the SDK's network-image integration so b0n, PCD and signing agree.
SB_CONFIG_NETCORE_HCI_IPC=y
SB_CONFIG_SECURE_BOOT_NETCORE=y
SB_CONFIG_NETCORE_APP_UPDATE=y
SB_CONFIG_SECURE_BOOT_NETCORE_SIGNATURE_TYPE_SOFTWARE=y

# Recovery uploads directly to the single application slot / network RAM
# mediator. There is deliberately no secondary flash slot or rollback.
SB_CONFIG_MCUBOOT_NRF53_MULTI_IMAGE_UPDATE=n
SB_CONFIG_PARTITION_MANAGER=n

# The SDK zip manifest assumes paired network slots. This recovery-only
# layout uses explicit signed BIN files and upload destinations instead.
SB_CONFIG_DFU_ZIP=n

# Private signing-key paths are supplied by the build wrapper, not committed.
