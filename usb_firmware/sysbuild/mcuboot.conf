# USB CDC-ACM bootloader, independent of the running application.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_PRODUCT="OpenPendant Recovery"
CONFIG_USB_DEVICE_MANUFACTURER="OpenPendant Development"
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

CONFIG_GPIO=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y
CONFIG_BOOT_SERIAL_DETECT_DELAY=0
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
CONFIG_BOOT_SERIAL_BOOT_MODE=y
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=n

# Direct upload into the one application slot; no external NAND access.
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y
CONFIG_BOOT_ERASE_PROGRESSIVELY=y
CONFIG_BOOT_MGMT_CUSTOM_STORAGE_ERASE=n
CONFIG_BOOT_VALIDATE_SLOT0=y

# Direct network recovery through RAM + PCD, not a two-slot swap.
CONFIG_BOOT_IMAGE_ACCESS_HOOKS=y
CONFIG_BOOT_IMAGE_ACCESS_HOOK_NRF5340=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH_SIMULATOR_DOUBLE_WRITES=y
CONFIG_FLASH_SIMULATOR_STATS=n
CONFIG_NRF53_MULTI_IMAGE_UPDATE=n
CONFIG_NRF53_RECOVERY_NETWORK_CORE=y
CONFIG_PCD_APP=y
# Match mcuboot.overlay's working SRAM; keep the 256 KiB network staging
# region out of the linker heap/stacks even during incremental rebuilds.
CONFIG_SRAM_BASE_ADDRESS=0x20002000
CONFIG_SRAM_SIZE=184

# Only drivers required for internal flash, USB and the entry button.
CONFIG_SPI=n
CONFIG_I2C=n
CONFIG_PWM=n
CONFIG_SETTINGS=n
