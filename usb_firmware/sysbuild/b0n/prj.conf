# Based on NCS 3.4 netboot/prj.conf, without SDK logging-only assignments.
# The additive ../b0n.conf supplies development access / quiet operation.
CONFIG_IS_SECURE_BOOTLOADER=y
CONFIG_MULTITHREADING=n
CONFIG_GPIO=n
CONFIG_ARM_MPU=n
CONFIG_TICKLESS_KERNEL=n
CONFIG_ERRNO=n
CONFIG_SYS_CLOCK_EXISTS=y
CONFIG_FPROTECT=y
CONFIG_FW_INFO=y
CONFIG_SECURE_BOOT_CRYPTO=y
CONFIG_SECURE_BOOT_VALIDATION=y
CONFIG_SECURE_BOOT_STORAGE=y
CONFIG_PCD_NET=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
# Software ECDSA adds nested big-integer frames to the hash-only netboot
# path. The SDK's general secure boot sample uses 2 KiB; leave 4 KiB here
# for validation plus PCD callers until on-target stack usage is measured.
CONFIG_MAIN_STACK_SIZE=4096
