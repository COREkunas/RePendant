CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_NRF_APPROTECT_USE_UICR=y
CONFIG_NRF_APPROTECT_LOCK=n

# Match the application's existing 251-byte ACL buffers. Without controller
# Data Length Extension the host's 225-byte notifications are fragmented into
# 27-byte link packets, even when ATT MTU negotiation succeeds at 247.
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# Pair with the application's bounded six-packet host queue. Fixed controller
# packet count only; no interval, PHY, radio-power or packet-size change.
CONFIG_BT_CTLR_SDC_TX_PACKET_COUNT=6
# The parent application admits exactly one bonded peripheral connection.
# Override the generic hci_ipc sample's16connection reservation. The SDK keeps
# one central and one peripheral role resource for a one-connection controller.
CONFIG_BT_MAX_CONN=1
